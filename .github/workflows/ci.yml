name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # size-limit@14 requires Node >=22.19 (uses node:fs/promises' `glob`
          # export, only available from Node 22+) - Node 20 fails at runtime.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (Produktions-Abhängigkeiten, ohne optionale)
        # alasql listet react-native-fs als optionale Abhängigkeit; sie landet
        # nicht im Browser-Build, löst aber sonst ~20 Funde aus (PLAN.md M05).
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Lint (fails on any warning, e.g. undefined JSX references)
        run: npm run lint:ci

      - name: Type-check (gradueller JSDoc-Typing über @ts-check pro Datei)
        run: npm run typecheck

      # Führt zugleich die komplette Vitest-Suite aus (ein Lauf statt `npm test` + Coverage).
      - name: Unit tests + coverage (gated for src/utils/*Engine.js, informational otherwise)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build

      - name: Bundle size regression check
        run: npm run size

      - name: Upload production build (für den Lighthouse-Job)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    # Lighthouse-CI gegen den Produktions-Build: A11y < 0.9 bricht den Build
    # (meta-viewport/Zoom-Blocker eingeschlossen); Performance/SEO/Best-Practices
    # warnen nur. Konfiguration: lighthouserc.json
    # Nutzt den Build des test-Jobs (kein zweites npm ci/build).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  bundle-size-report:
    # Kommentiert den Bundle-Size-Trend (Vorher/Nachher pro Chunk) direkt in
    # den PR, damit schleichendes Wachstum sichtbar wird, bevor ein
    # size-limit-Grenzwert reißt (siehe "size"-Job oben, der hart gated).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle size trend comment
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
