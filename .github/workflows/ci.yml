name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # size-limit@13 requires Node >=22.18 (uses node:fs/promises' `glob`
          # export, only available from Node 22+) - Node 20 fails at runtime.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (fails on any warning, e.g. undefined JSX references)
        run: npm run lint:ci

      - name: Type-check (gradueller JSDoc-Typing über @ts-check pro Datei)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Coverage report (informational, not gated)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build

      - name: Bundle size regression check
        run: npm run size

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
