# TEMPORÄR: erzeugt package-lock.json auf einem GitHub-Runner (npm-Registry erreichbar)
# und committet ihn auf den ausgewählten Branch. Nach Gebrauch wieder löschen.
name: Update lockfile (temporär)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Lockfile committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "Keine Änderung" && exit 0
          git commit -m "chore: package-lock.json für Tailwind und lokale Schriften aktualisieren"
          git push
